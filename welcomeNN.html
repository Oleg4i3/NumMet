<!DOCTYPE html>
<html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light"><title>Банер: згорткова мережа сканує кота</title>
<style>html,body{margin:0;height:100%;background:#fff;overflow:hidden}canvas{display:block;width:100%;height:100%}</style></head>
<body><canvas id="c"></canvas>
<script>
(function(){
var cv=document.getElementById('c'),g=cv.getContext('2d'),W,H,D,cat,catS=0;
var BLUE=[47,111,219],RED=[214,69,47],INK='#2c3e50';
var N=6,fm=new Array(N*N).fill(0),cur=-1,pos={x:0,y:0},LAY=[4,6,3,2];
function hash(a,b){var s=Math.sin(a*127.1+b*311.7)*43758.5453;return s-Math.floor(s)}
function col(v,a){var c=v>=0?BLUE:RED;return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'}
function ell(c,x,y,rx,ry,f,s){c.beginPath();c.ellipse(x,y,rx,ry,0,0,7);if(f){c.fillStyle=f;c.fill()}if(s){c.strokeStyle=s;c.lineWidth=3;c.stroke()}}
function poly(c,p,f){c.beginPath();c.moveTo(p[0],p[1]);for(var i=2;i<p.length;i+=2)c.lineTo(p[i],p[i+1]);c.closePath();c.fillStyle=f;c.fill()}
function drawCat(s){var o=document.createElement('canvas');o.width=o.height=s*D;var c=o.getContext('2d');c.scale(s*D/200,s*D/200);
 c.fillStyle='#e8f1fb';c.beginPath();c.roundRect(0,0,200,200,18);c.fill();c.fillStyle='#cfe0f5';c.fillRect(0,168,200,32);
 ell(c,100,188,62,34,'#f2a65a');
 poly(c,[44,70,52,18,92,44],'#f2a65a');poly(c,[156,70,148,18,108,44],'#f2a65a');poly(c,[54,60,57,32,80,48],'#f6b8c4');poly(c,[146,60,143,32,120,48],'#f6b8c4');
 ell(c,100,104,66,58,'#f2a65a');
 c.strokeStyle='#c97a2f';c.lineWidth=5;c.lineCap='round';[[100,48,100,66],[84,50,86,64],[116,50,114,64],[38,100,54,102],[40,116,55,114],[162,100,146,102],[160,116,145,114]].forEach(function(l){c.beginPath();c.moveTo(l[0],l[1]);c.lineTo(l[2],l[3]);c.stroke()});
 ell(c,100,128,28,20,'#fbe3c4');
 [[72,98],[128,98]].forEach(function(e){ell(c,e[0],e[1],13,15,'#fff','#2c3e50');ell(c,e[0]+1,e[1]+1,8,11,'#5aa469');ell(c,e[0]+1,e[1]+1,4,9,'#14213d');ell(c,e[0]+4,e[1]-4,2.6,2.6,'#fff')});
 poly(c,[93,116,107,116,100,126],'#e87a90');c.strokeStyle='#14213d';c.lineWidth=2.6;c.beginPath();c.moveTo(100,126);c.lineTo(100,133);c.moveTo(100,133);c.quadraticCurveTo(90,142,82,134);c.moveTo(100,133);c.quadraticCurveTo(110,142,118,134);c.stroke();
 c.lineWidth=1.8;[[-1,-4],[-1,3],[1,-4],[1,3]].forEach(function(w,i){var sx=i<2?-1:1;c.beginPath();c.moveTo(100+sx*22,128+w[1]);c.lineTo(100+sx*62,126+w[1]*3.5);c.stroke()});
 ell(c,60,122,9,6,'rgba(240,120,130,.35)');ell(c,140,122,9,6,'rgba(240,120,130,.35)');return o}
function resize(){D=window.devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*D;cv.height=H*D;catS=Math.min(H*.78,W*.33);cat=drawCat(catS)}
function arrow(x1,y1,x2,y2){g.strokeStyle='#9fb0c6';g.lineWidth=1.6;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();var a=Math.atan2(y2-y1,x2-x1);g.beginPath();g.moveTo(x2,y2);g.lineTo(x2-8*Math.cos(a-.5),y2-8*Math.sin(a-.5));g.lineTo(x2-8*Math.cos(a+.5),y2-8*Math.sin(a+.5));g.closePath();g.fillStyle='#9fb0c6';g.fill()}
function label(t,x,y){g.fillStyle='#7a889e';g.font='12px "Segoe UI",sans-serif';g.textAlign='center';g.fillText(t,x,y)}
function frame(ms){var t=ms/1000;g.setTransform(D,0,0,D,0,0);g.clearRect(0,0,W,H);
 var cx=W*.04,cy=(H-catS)/2-4;g.drawImage(cat,cx,cy,catS,catS);g.strokeStyle='#cfd8e6';g.lineWidth=1;g.strokeRect(cx,cy,catS,catS);
 /* вікно ядра */
 var ww=catS*.3,step=Math.floor(t/.32)%(N*N),col0=step%N,row0=Math.floor(step/N);
 var tx=cx+col0*(catS-ww)/(N-1),ty=cy+row0*(catS-ww)/(N-1);pos.x+=(tx-pos.x)*.25;pos.y+=(ty-pos.y)*.25;if(Math.abs(tx-pos.x)>catS)pos.x=tx;
 if(step!==cur){cur=step;fm[step]=.25+.75*hash(step,Math.floor(t/(.32*N*N)))}
 if(step===0&&t%(.32*N*N)<.4)for(var i=0;i<fm.length;i++)if(i)fm[i]*=.3;
 g.fillStyle='rgba(47,111,219,.14)';g.fillRect(pos.x,pos.y,ww,ww);g.strokeStyle='#2f6fdb';g.lineWidth=2.2;g.strokeRect(pos.x,pos.y,ww,ww);
 g.lineWidth=.8;g.strokeStyle='rgba(47,111,219,.55)';for(var k=1;k<3;k++){g.beginPath();g.moveTo(pos.x+ww*k/3,pos.y);g.lineTo(pos.x+ww*k/3,pos.y+ww);g.moveTo(pos.x,pos.y+ww*k/3);g.lineTo(pos.x+ww,pos.y+ww*k/3);g.stroke()}
 /* ядро 3x3 */
 var ks=Math.min(H*.17,W*.06),kx=cx+catS+W*.07,ky=H*.18;
 for(var r=0;r<3;r++)for(var q=0;q<3;q++){var w=Math.sin(t*.9+r*1.7+q*.9+1.3*r*q);g.fillStyle=col(w,.25+.65*Math.abs(w));g.fillRect(kx+q*ks,ky+r*ks,ks-2,ks-2)}
 g.strokeStyle='#2f6fdb';g.lineWidth=1.6;g.strokeRect(kx-2,ky-2,ks*3+2,ks*3+2);label('ядро (ваги)',kx+ks*1.5,ky-8);
 g.strokeStyle='rgba(47,111,219,.35)';g.lineWidth=1;g.setLineDash([4,4]);g.beginPath();g.moveTo(pos.x+ww,pos.y);g.lineTo(kx-2,ky-2);g.moveTo(pos.x+ww,pos.y+ww);g.lineTo(kx-2,ky+ks*3);g.stroke();g.setLineDash([]);
 /* карта ознак */
 var fs=Math.min(H*.06,W*.021),fx=kx+ks*1.5-fs*N/2,fy=H*.58;
 for(var a=0;a<N;a++)for(var b=0;b<N;b++){var v=fm[a*N+b];g.fillStyle=v>0?col(1,.12+.8*v):'#eef2f8';g.fillRect(fx+b*fs,fy+a*fs,fs-1.5,fs-1.5)}
 g.strokeStyle='#2f6fdb';g.lineWidth=2;g.strokeRect(fx+col0*fs-1,fy+row0*fs-1,fs+.5,fs+.5);label('карта ознак',fx+fs*N/2,fy+fs*N+16);
 arrow(kx+ks*1.5,ky+ks*3+4,kx+ks*1.5,fy-6);
 /* мережа */
 var gx0=fx+fs*N+W*.07,gx1=W*.86,gy0=H*.14,gy1=H*.8,L=LAY.length,P=[];
 arrow(fx+fs*N+6,fy+fs*N/2,gx0-18,fy+fs*N/2);
 for(var l=0;l<L;l++){P[l]=[];for(var n=0;n<LAY[l];n++)P[l].push([gx0+(gx1-gx0)*l/(L-1),(gy0+gy1)/2+(n-(LAY[l]-1)/2)*Math.min(46,(gy1-gy0)/(Math.max.apply(null,LAY)-1))])}
 for(l=0;l<L-1;l++)for(var i2=0;i2<LAY[l];i2++)for(var j=0;j<LAY[l+1];j++){var ph=hash(l*31+i2,j*17+3)*6.28,sp=.35+hash(i2+7,j+l)*.5,wv=Math.sin(t*sp+ph);
  g.strokeStyle=col(wv,.1+.5*Math.abs(wv));g.lineWidth=.3+1.5*Math.abs(wv);g.beginPath();g.moveTo(P[l][i2][0],P[l][i2][1]);g.lineTo(P[l+1][j][0],P[l+1][j][1]);g.stroke()}
 for(l=0;l<L;l++)for(n=0;n<LAY[l];n++){var av=.5+.5*Math.sin(t*.8+n*1.9+l*1.1);if(l===L-1)av=n===0?.88+.1*Math.sin(t*1.3):.12+.08*Math.sin(t*1.1+1);
  g.beginPath();g.arc(P[l][n][0],P[l][n][1],l===L-1?15:11,0,7);g.fillStyle='rgba(47,111,219,'+(.12+.75*av)+')';g.fill();g.strokeStyle=INK;g.lineWidth=l===L-1&&n===0?2.4:1.5;g.stroke()}
 g.font=Math.round(Math.min(34,H*.09))+'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';g.textAlign='left';g.textBaseline='middle';g.fillStyle='#000';
 g.fillText('\uD83D\uDC31',P[3][0][0]+24,P[3][0][1]+2);g.fillText('\uD83D\uDC36',P[3][1][0]+24,P[3][1][1]+2);g.textBaseline='alphabetic';
 label('вхід',P[0][0][0],gy1+34);label('приховані шари',P[1][0][0],gy1+34);label('',P[2][0][0],gy1+34);label('вихід',P[3][0][0],gy1+34);
 requestAnimationFrame(frame)}
if(!CanvasRenderingContext2D.prototype.roundRect)CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h){this.rect(x,y,w,h)};
window.addEventListener('resize',resize);resize();requestAnimationFrame(frame);
})();
</script></body></html>
