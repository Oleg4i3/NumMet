const D={uk:{

story:'<p>Камера фотографує маятник, що згасає, у <b>нерівні</b> моменти часу $t_i$. З кожного знімка виміряно кут відхилення $\\theta_i$ (рад, із шумом). Модель: $$\\theta(t)=A\\,e^{-\\gamma t}\\cos(\\omega t+\\varphi)$$ Параметри $\\mathbf p=(A,\\gamma,\\omega,\\varphi)$ невідомі. Маятник гойдається один раз; камера знімає його в нерівні моменти часу, і кожен знімок додає точку на графік.</p>',

tasks:`<h2>Завдання</h2><ol>
<li><b>Вручну.</b> Повзунками підберіть $A,\\gamma,\\omega,\\varphi$, щоб крива пройшла крізь точки. Запишіть найменший RMSE та кількість спроб.</li>
<li><b>Чому це важко.</b> Пошук 4-вимірний; мінімізуємо $$S(\\mathbf p)=\\sum_{i=1}^{N}\\big(\\theta_i-\\theta(t_i;\\mathbf p)\\big)^2\\to\\min.$$ Ландшафт $S$ має багато локальних мінімумів, переважно за $\\omega$ та $\\varphi$ (за $A,\\gamma$ він значно «спокійніший»). Обмеження: $A>0,\\ \\omega>0,\\ \\varphi\\in[-\\pi,\\pi]$, інакше розв’язки дублюються: $(A,\\varphi)\\sim(-A,\\varphi+\\pi)$.</li>
<li><b>Градієнт.</b> Експортуйте дані в Excel. У комірках задайте модель <code>=A*EXP(-g*t)*COS(w*t+phi)</code>, $S$ як суму квадратів і запустіть Solver, метод <i>GRG Nonlinear</i>, стартуючи з вашого ручного підгону. Потім стартуйте з поганої точки (напр. $\\omega$ вдвічі більше) і порівняйте.</li>
<li><b>ГА.</b> Те саме, але <i>Evolutionary</i> (або власний ГА). Межі змінних обов’язкові. Запустіть 5 разів: чи стабільний результат? Скільки обчислень $S$?</li>
<li><b>Питання.</b> Чому RMSE найкращого підгону ≈ $\\sigma\\sqrt{(N-4)/N}$, а не 0? Що буде, якщо RMSE вийде <i>менший</i> за шум?</li></ol>`,
chk:'Ландшафти та градієнтний пошук',land:'Показати ландшафти (усі 6 пар)',run:'▶ Градієнт зі стартової точки',apply:'Застосувати до повзунків',pick:'Спочатку клікніть по одній із карт, щоб обрати пару параметрів і старт.',it:'ітерацій',spS:'Спойлер: що таке S, RMSE, σ і чому квадрат, а не модуль',
spB:`<p><b>Нев’язка</b> у точці $i$: $r_i=\\theta_i-\\theta(t_i;\\mathbf p)$.</p>
<p><b>$S$</b> (сума квадратів відхилень, SSE): $$S(\\mathbf p)=\\sum_{i=1}^{N} r_i^2.$$ Мінімізація $S$ за $\\mathbf p$ — це нелінійний метод найменших квадратів (НМК).</p>
<p><b>RMSE</b> — той самий $S$ у фізичних одиницях: $$\\mathrm{RMSE}=\\sqrt{S/N}.$$ Ділення на $N$ усереднює, корінь повертає радіани: це «типове відхилення моделі від точки». Мінімуми $S$ і RMSE збігаються, тож оптимізуємо $S$, а порівнюємо за RMSE.</p>
<p><b>Звідки шум і що таке $\\sigma$.</b> Реальний вимір неідеальний: камера трохи тремтить (похибка зчитування кута), а вітерець підгойдує маятник. У симуляторі до кожного кута додано гаусів шум зі стандартним відхиленням $\\sigma=3\\%$ від початкової амплітуди. Різниця між цими двома джерелами важлива: тремтіння камери дає <i>незалежні</i> похибки в кожній точці (і майже гаусові за центральною граничною теоремою, бо це сума багатьох дрібних впливів). Поштовх вітерцю збурює саму траєкторію й тягнеться в наступні точки, тобто дає <i>корельовані</i> похибки. У симуляторі вітру немає, але в реальності він порушує припущення, за яких НМК оптимальний.</p>
<p><b>Чому найкращий підгін має RMSE ≈ $\\sigma\\sqrt{(N-4)/N}$, а не $\\sigma$ і не 0.</b> Вектор даних живе в $N$-вимірному просторі. Модель із $p=4$ параметрами може зсувати підігнану криву лише в $p$ напрямках (поблизу розв’язку — у дотичному просторі моделі). НМК — ортогональна проекція даних на цей підпростір, а нев’язка лишається в ортогональному доповненні розмірності $N-p$. Шум ізотропний (незалежні однакові компоненти), тож кожен із цих $N-p$ напрямків несе дисперсію $\\sigma^2$: $$\\mathbb E[S_{\\min}]\\approx\\sigma^2(N-p),\\qquad \\mathrm{RMSE}_{\\min}\\approx\\sigma\\sqrt{\\frac{N-p}{N}}.$$ Підгін «з’їдає» $p$ степенів свободи шуму, тому RMSE менший за $\\sigma$. Якщо ваш RMSE помітно нижчий — це перенавчання (при $N=p$ крива проходить рівно через усі точки, $S=0$). Для нелінійної моделі формула наближена: вона працює там, де модель майже лінійна. Орієнтир для зупинки: оцініть $A$ з графіка й порівняйте свій RMSE з $0{,}03\\,A\\sqrt{(N-4)/N}$.</p>
<p><b>Чому квадрат, а не модуль $|r_i|$?</b></p><ol>
<li><b>Гладкість.</b> Градієнт $r^2$ існує всюди й прямує до нуля в мінімумі, тож крок градієнтного спуску сам зменшується. Для $|r|$ похідної в нулі немає, а поруч її модуль завжди дорівнює 1: градієнт не слабшає біля мінімуму, тому зі сталим кроком ми коливаємося навколо нього з амплітудою порядку кроку, а критерій $\\|\\nabla S\\|\\to 0$ не працює. У $\\sum|r_i|$ зламів ще більше: це цілі «хребти» $r_i(\\mathbf p)=0$ у просторі параметрів. Зауваження: надто великий крок «перестрибує» і для гладкої функції (для параболи з кривиною $L$ метод розбігається при кроці $>2/L$). Гладкість гарантує лише, що достатньо малий крок (його знаходить backtracking) збігається.</li>
<li><b>Градієнт пропорційний помилці.</b> Похідна $\\rho'(r)=2r$ лінійна за $r$, і це єдина функція з такою властивістю (лінійна похідна ⇔ парабола). Звідси $$\\nabla S=-2\\,J^{\\top}\\mathbf r,\\qquad J_{ik}=\\partial\\theta(t_i)/\\partial p_k:$$ сама помилка вказує, де мінімум. Для моделі, лінійної за параметрами, $S$ — точна квадратична форма: метод Ньютона потрапляє в мінімум за один крок, метод спряжених градієнтів — не більш ніж за $n$ кроків ($n$ — число параметрів), а нормальні рівняння $J^{\\top}J\\,\\mathbf p=J^{\\top}\\vec\\theta$ розв’язуються напряму. Наша модель нелінійна за $\\gamma,\\omega,\\varphi$ (лінійна лише за $A$), тож $S(\\mathbf p)$ квадратична лише локально. На цьому тримаються методи Гаусса–Ньютона та Левенберга–Марквардта, які лінеаризують модель, тому й важливий добрий старт.</li>
<li><b>Статистика.</b> Якщо похибки незалежні й гаусові з однаковою $\\sigma$ (тремтіння камери), метод найбільшої правдоподібності дає саме $\\min\\sum r_i^2$ (щільність $\\propto e^{-r^2/2\\sigma^2}$). Теорема Гаусса–Маркова йде далі: для лінійної моделі й некорельованих похибок з однаковою дисперсією НМК має найменшу дисперсію серед лінійних незміщених оцінок, навіть без гаусовості. Модулю відповідає лапласівський шум, а корельований шум (вітерець) потребує інших методів.</li>
<li><b>Фізичний.</b> Уявіть, що кожна точка з’єднана з кривою пружинкою. За законом Гука сила $\\propto r$, енергія $\\propto r^2$, а положення рівноваги системи пружин — це мінімум $S$. Це той самий пункт 2: «сила» — це градієнт. (Йдеться про енергію пружинок; хоча для малих кутів і енергія самого маятника $\\propto\\theta^2$.)</li>
<li><b>Геометричний.</b> Незалежні похибки некорельовані, тобто ортогональні як випадкові величини (скалярний добуток — коваріація): їхні знаки однаково ймовірно збігаються чи протилежні, тож «в середньому вони під прямим кутом». Тому дисперсії додаються за теоремою Піфагора, $\\sigma_\\Sigma^2=\\sum\\sigma_i^2$, і похибка суми росте як $\\sqrt N$, а не як $N$. У просторі даних НМК — ортогональна проекція: нев’язка перпендикулярна моделі ($J^{\\top}\\mathbf r=0$) і $\\|\\vec\\theta\\|^2=\\|\\hat{\\vec\\theta}\\|^2+\\|\\mathbf r\\|^2$. Це не лише краса: звідси і нормальні рівняння, і підрахунок $N-p$ вище.</li></ol>
<p><b>Ціна квадрата:</b> чутливість до викидів, бо внесок росте як $r^2$ і один поганий знімок сильно тягне криву. Квадрат дає «середнє», модуль — «медіану» (робастнішу); компроміс — функція Хьюбера. <i>Питання:</i> чи зникнуть локальні мінімуми на карті $(\\omega,\\varphi)$, якщо замінити квадрат модулем? (Ні: їх породжує осцилюючий косинус, а не вибір норми.)</p>`,
lt:'Кожна карта — зріз ландшафту $S(\\mathbf p)$ за двома параметрами; інші два зафіксовані на значеннях повзунків (світлі зони — малі $S$, шкала логарифмічна). Білий кружок — поточні повзунки. <b>Клікніть по карті</b>, щоб обрати пару і стартову точку, та запустіть градієнтний спуск із підбором кроку: червона лінія — траєкторія, квадрат — де зупинився. Пробуйте різні старти та різні пари.'},
en:{
title:'Damped pendulum: gradient vs genetic algorithm',
story:'<p>A camera photographs a damped pendulum at <b>irregular</b> times $t_i$. Each photo gives a measured deflection angle $\\theta_i$ (rad, noisy). Model: $$\\theta(t)=A\\,e^{-\\gamma t}\\cos(\\omega t+\\varphi)$$ The parameters $\\mathbf p=(A,\\gamma,\\omega,\\varphi)$ are unknown. The pendulum swings once; the camera shoots it at irregular times and each photo adds a point to the graph.</p>',
seedl:'Your ID/surname (seed):',gen:'Generate data',rmse:'Manual-fit RMSE, rad:',pause:'⏸ Pause',replay:'↻ Replay shoot',xlsx:'⬇ Excel (.xlsx)',csv:'⬇ CSV',
n:'points: ',tcol:'t, s',ycol:'θ, rad',
tasks:`<h2>Tasks</h2><ol>
<li><b>By hand.</b> Use the sliders to tune $A,\\gamma,\\omega,\\varphi$ so the curve passes through the points. Record your lowest RMSE and number of attempts.</li>
<li><b>Why it is hard.</b> The search is 4-dimensional; we minimise $$S(\\mathbf p)=\\sum_{i=1}^{N}\\big(\\theta_i-\\theta(t_i;\\mathbf p)\\big)^2\\to\\min.$$ $S$ has many local minima, mostly along $\\omega$ and $\\varphi$ (along $A,\\gamma$ it is much calmer). Constraints: $A>0,\\ \\omega>0,\\ \\varphi\\in[-\\pi,\\pi]$, otherwise solutions duplicate: $(A,\\varphi)\\sim(-A,\\varphi+\\pi)$.</li>
<li><b>Gradient.</b> Export to Excel. Put the model <code>=A*EXP(-g*t)*COS(w*t+phi)</code> in cells, $S$ as a sum of squares, and run Solver with <i>GRG Nonlinear</i>, starting from your manual fit. Then start from a bad point (e.g. $\\omega$ twice too large) and compare.</li>
<li><b>GA.</b> Same, but <i>Evolutionary</i> (or your own GA). Variable bounds are mandatory. Run 5 times: is the result stable? How many evaluations of $S$?</li>
<li><b>Question.</b> Why is the best-fit RMSE ≈ $\\sigma\\sqrt{(N-4)/N}$ rather than 0? What if your RMSE comes out <i>below</i> the noise?</li></ol>`,
chk:'Landscapes and gradient search',land:'Show landscapes (all 6 pairs)',run:'▶ Gradient from start point',apply:'Apply to sliders',pick:'First click one of the maps to choose a parameter pair and a start.',it:'iterations',spS:'Spoiler: what S, RMSE and σ are, and why squares rather than absolute values',
spB:`<p><b>Residual</b> at point $i$: $r_i=\\theta_i-\\theta(t_i;\\mathbf p)$.</p>
<p><b>$S$</b> (sum of squared errors, SSE): $$S(\\mathbf p)=\\sum_{i=1}^{N} r_i^2.$$ Minimising $S$ over $\\mathbf p$ is nonlinear least squares.</p>
<p><b>RMSE</b> is the same $S$ in physical units: $$\\mathrm{RMSE}=\\sqrt{S/N}.$$ Dividing by $N$ averages, and the root returns radians: the “typical deviation of the model from a point”. $S$ and RMSE share the same minimiser, so we optimise $S$ and compare fits by RMSE.</p>
<p><b>Where the noise comes from and what $\\sigma$ is.</b> A real measurement is imperfect: the camera shakes a little (angle reading error) and a breeze nudges the pendulum. In the simulator every angle gets Gaussian noise with standard deviation $\\sigma=3\\%$ of the initial amplitude. The two sources differ in an important way: camera shake gives <i>independent</i> errors at each point (and nearly Gaussian ones by the central limit theorem, being a sum of many small effects). A gust perturbs the trajectory itself and carries over to later points, giving <i>correlated</i> errors. The simulator has no wind, but in reality it breaks the assumptions under which least squares is optimal.</p>
<p><b>Why the best fit has RMSE ≈ $\\sigma\\sqrt{(N-4)/N}$, not $\\sigma$ and not 0.</b> The data vector lives in $N$-dimensional space. A model with $p=4$ parameters can move the fitted curve only along $p$ directions (near the solution, the model’s tangent space). Least squares is the orthogonal projection of the data onto that subspace, and the residual stays in the orthogonal complement of dimension $N-p$. The noise is isotropic (independent identical components), so each of those $N-p$ directions carries variance $\\sigma^2$: $$\\mathbb E[S_{\\min}]\\approx\\sigma^2(N-p),\\qquad \\mathrm{RMSE}_{\\min}\\approx\\sigma\\sqrt{\\frac{N-p}{N}}.$$ The fit “eats” $p$ degrees of freedom of the noise, so RMSE is below $\\sigma$. If your RMSE is noticeably lower, that is overfitting (at $N=p$ the curve passes exactly through all points, $S=0$). For a nonlinear model the formula is approximate: it holds where the model is nearly linear. A stopping guide: estimate $A$ from the graph and compare your RMSE with $0.03\\,A\\sqrt{(N-4)/N}$.</p>
<p><b>Why squares rather than $|r_i|$?</b></p><ol>
<li><b>Smoothness.</b> The gradient of $r^2$ exists everywhere and tends to zero at the minimum, so the gradient-descent step shrinks by itself. For $|r|$ the derivative does not exist at zero, and nearby its magnitude is always 1: the gradient does not weaken near the minimum, so with a fixed step we oscillate around it with amplitude of the order of the step, and the criterion $\\|\\nabla S\\|\\to 0$ fails. $\\sum|r_i|$ has many more kinks: whole “ridges” $r_i(\\mathbf p)=0$ in parameter space. Caveat: too large a step also overshoots on a smooth function (for a parabola of curvature $L$ the method diverges at step $>2/L$). Smoothness only guarantees that a small enough step (found by backtracking) converges.</li>
<li><b>Gradient proportional to the error.</b> The derivative $\\rho'(r)=2r$ is linear in $r$, and this is unique to the parabola (linear derivative ⇔ parabola). Hence $$\\nabla S=-2\\,J^{\\top}\\mathbf r,\\qquad J_{ik}=\\partial\\theta(t_i)/\\partial p_k:$$ the error itself points to the minimum. For a model linear in its parameters, $S$ is an exact quadratic form: Newton’s method lands on the minimum in one step, conjugate gradients in at most $n$ steps ($n$ = number of parameters), and the normal equations $J^{\\top}J\\,\\mathbf p=J^{\\top}\\vec\\theta$ can be solved directly. Our model is nonlinear in $\\gamma,\\omega,\\varphi$ (linear only in $A$), so $S(\\mathbf p)$ is quadratic only locally. Gauss–Newton and Levenberg–Marquardt rely on this by linearising the model, which is why a good starting point matters.</li>
<li><b>Statistics.</b> If errors are independent Gaussian with equal $\\sigma$ (camera shake), maximum likelihood gives exactly $\\min\\sum r_i^2$ (density $\\propto e^{-r^2/2\\sigma^2}$). The Gauss–Markov theorem goes further: for a linear model and uncorrelated errors of equal variance, least squares has the smallest variance among linear unbiased estimators, even without Gaussianity. The absolute value corresponds to Laplace noise, and correlated noise (the breeze) needs other methods.</li>
<li><b>Physical.</b> Imagine each point attached to the curve by a spring. By Hooke’s law the force is $\\propto r$, the energy is $\\propto r^2$, and the equilibrium of the springs is the minimum of $S$. This is point 2 again: the “force” is the gradient. (This is the springs’ energy; though for small angles the pendulum’s own energy is also $\\propto\\theta^2$.)</li>
<li><b>Geometric.</b> Independent errors are uncorrelated, i.e. orthogonal as random variables (the inner product is the covariance): their signs agree or differ with equal probability, so “on average they are at right angles”. Hence variances add by the Pythagorean theorem, $\\sigma_\\Sigma^2=\\sum\\sigma_i^2$, and the error of a sum grows as $\\sqrt N$, not $N$. In data space least squares is an orthogonal projection: the residual is perpendicular to the model ($J^{\\top}\\mathbf r=0$) and $\\|\\vec\\theta\\|^2=\\|\\hat{\\vec\\theta}\\|^2+\\|\\mathbf r\\|^2$. This is more than beauty: it gives the normal equations and the $N-p$ count above.</li></ol>
<p><b>The price of squaring:</b> sensitivity to outliers, since the contribution grows as $r^2$ and one bad photo pulls the curve hard. Squares give a “mean”, absolute values a “median” (more robust); Huber loss is a compromise. <i>Question:</i> would the local minima on the $(\\omega,\\varphi)$ map disappear if the square were replaced by the absolute value? (No: they come from the oscillating cosine, not from the choice of norm.)</p>`,
lt:'Each map is a slice of the landscape $S(\\mathbf p)$ in two parameters; the other two are fixed at the slider values (bright = small $S$, log scale). The white ring is your current sliders. <b>Click a map</b> to choose the pair and start point, then run gradient descent with step-size backtracking: the red line is the path, the square is where it stopped. Try different starts and different pairs.'}};
