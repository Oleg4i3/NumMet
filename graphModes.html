<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Спектр графа: кластеризація (віджет)</title>
<style>
  html,body{margin:0;background:#fff;font-family:Inter,'Segoe UI',Arial,sans-serif;}
  #wrap{max-width:640px;margin:0 auto;}
  canvas{display:block;width:100%;height:auto;background:#fdfdfd;}
  #bar{display:flex;gap:8px;justify-content:center;align-items:center;padding:4px;font-size:11px;color:#5B6478;flex-wrap:wrap;}
  #bar select{font-size:11px;padding:2px 4px;border:1px solid #DDE1E8;border-radius:5px;background:#fff;color:#1D2433;}
  .eq{display:flex;gap:3px;justify-content:center;align-items:flex-end;padding:0 4px 6px;}
  .eq .col{display:flex;flex-direction:column;align-items:center;gap:1px;}
  .eq input[type=range]{width:12px;height:44px;writing-mode:vertical-lr;direction:rtl;accent-color:#2C5FE0;appearance:auto;}
  .eq .cap{font-size:8.5px;color:#5B6478;line-height:1;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="620" height="178"></canvas>
  <div id="bar">
    <select id="exSel" title="який граф показати">
      <option value="0">Призма C₃□K₂</option>
      <option value="1">K₃,₃ (дводольний)</option>
      <option value="2">Приклад 1: K₂,₃+ребро+висяча</option>
      <option value="3">Приклад 1: 2 трикутники через вершину</option>
    </select>
    <b id="lamLab">λ₂ = 2.00</b>
  </div>
  <div class="eq" title="амплітуди мод λ2…λ6 у русі вершин">
    <div class="col"><input type="range" id="a1" min="0" max="100" value="100"><span class="cap">λ₂</span></div>
    <div class="col"><input type="range" id="a2" min="0" max="100" value="0"><span class="cap">λ₃</span></div>
    <div class="col"><input type="range" id="a3" min="0" max="100" value="0"><span class="cap">λ₄</span></div>
    <div class="col"><input type="range" id="a4" min="0" max="100" value="0"><span class="cap">λ₅</span></div>
    <div class="col"><input type="range" id="a5" min="0" max="100" value="0"><span class="cap">λ₆</span></div>
  </div>
</div>
<script>
(function(){
  'use strict';
  const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
  const SPEED=0.2, MAX_AMP=16, R=12, EPS=1e-3, TAU=3;
  const NEUTRAL=['#c0c0c0','#c0c0c0','#c0c0c0','#c0c0c0','#c0c0c0','#c0c0c0'];

  /* дані з isomorphism2.html */
  const GRAPHS=[
    { label:'λ₂ = 2.00', def:1,          /* дефолт еквалайзера: індекс моди-1 */
      pos:[[250,70],[130,150],[370,150],[250,230],[130,310],[370,310]],
      edges:[[0,1],[1,2],[2,0],[3,4],[4,5],[5,3],[0,3],[1,4],[2,5]],
      lam:[0,2,3,3,5,5],
      vec:[[0.408,0.408,0.408,0.408,0.408,0.408],
           [0.408,0.408,0.408,-0.408,-0.408,-0.408],
           [0.577,-0.289,-0.289,0.577,-0.289,-0.289],
           [0,0.5,-0.5,0,0.5,-0.5],
           [0.577,-0.289,-0.289,-0.577,0.289,0.289],
           [0,0.5,-0.5,0,-0.5,0.5]] },
    { label:'λ₆ = 6.00 — виявляє долі дводольного графа', def:5,
      pos:[[150,100],[150,200],[150,300],[350,100],[350,200],[350,300]],
      edges:[[0,3],[0,4],[0,5],[1,3],[1,4],[1,5],[2,3],[2,4],[2,5]],
      lam:[0,3,3,3,3,6],
      vec:[[0.408,0.408,0.408,0.408,0.408,0.408],
           [0.816,-0.408,-0.408,0,0,0],
           [0,0.707,-0.707,0,0,0],
           [0,0,0,0.816,-0.408,-0.408],
           [0,0,0,0,0.707,-0.707],
           [0.408,0.408,0.408,-0.408,-0.408,-0.408]] },
    { label:'λ₂ = 0.76', def:1,
      pos:[[370,200],[90,200],[290,200],[200,80],[200,320],[440,200]],
      edges:[[0,3],[0,4],[0,5],[1,2],[1,3],[1,4],[2,3],[2,4]],
      lam:[0,0.763932,3,3,4,5.236068],
      vec:[[0.408,0.408,0.408,0.408,0.408,0.408],
           [0.195,-0.316,-0.316,-0.195,-0.195,0.828],
           [0,0,0,-0.707,0.707,0],
           [0.73,-0.365,-0.365,0.183,0.183,-0.365],
           [0,0.707,-0.707,0,0,0],
           [0.512,0.316,0.316,-0.512,-0.512,-0.121]] },
    { label:'λ₂ = 0.76', def:1,
      pos:[[250,200],[120,110],[370,110],[370,290],[440,200],[120,290]],
      edges:[[0,1],[0,2],[0,3],[0,5],[1,5],[2,3],[2,4],[3,4]],
      lam:[0,0.763932,3,3,4,5.236068],
      vec:[[0.408,0.408,0.408,0.408,0.408,0.408],
           [0.121,0.512,-0.316,-0.316,-0.512,0.512],
           [0.361,-0.282,0.361,0.361,-0.723,-0.079],
           [0.052,0.674,0.052,0.052,-0.105,-0.726],
           [0,0,0.707,-0.707,0,0],
           [0.828,-0.195,-0.316,-0.316,0.195,-0.195]] }
  ];

  function prep(g){
    let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
    g.pos.forEach(function(p){
      minX=Math.min(minX,p[0]); maxX=Math.max(maxX,p[0]);
      minY=Math.min(minY,p[1]); maxY=Math.max(maxY,p[1]);
    });
    const mrg=MAX_AMP+R+4;
    const s=Math.min((cv.width-2*mrg)/(maxX-minX),(cv.height-2*mrg)/(maxY-minY));
    const tx=cv.width/2-s*(minX+maxX)/2, ty=cv.height/2-s*(minY+maxY)/2;
    g.px=g.pos.map(function(p){ return [p[0]*s+tx, p[1]*s+ty]; });
  }

  const sliders=['a1','a2','a3','a4','a5'].map(function(id){ return document.getElementById(id); });
  function ampOf(m){ return sliders[m-1].value/100; }
  function setDefaults(g){
    sliders.forEach(function(s){ s.value='0'; });
    sliders[g.def-1].value='100';
  }

  let cur=GRAPHS[0];
  prep(cur); setDefaults(cur);
  let tAcc=0, last=null;
  let Q=[0,0,0,0,0,0];

  function step(t){
    const dx=[0,0,0,0,0,0], dy=[0,0,0,0,0,0];
    const val=[0,0,0,0,0,0], bnd=[0,0,0,0,0,0];
    let rSum=0, wSum=0, totAmp=0;
    for (let m=1;m<6;m++){
      const a=ampOf(m); if (a<=0.005) continue;
      const w=(Math.sqrt(cur.lam[m])+0.5)*1.5;
      const A=a*MAX_AMP*Math.cos(t*w/100);
      rSum+=a*(SPEED*w/100); wSum+=a; totAmp+=a;
      for (let i=0;i<6;i++){
        const c=cur.vec[m][i], d=c*A;
        if (m%2===1) dx[i]+=d; else dy[i]+=d;
        val[i]+=d; bnd[i]+=Math.abs(c)*a*MAX_AMP;
      }
    }
    return {dx:dx, dy:dy, val:val, bnd:bnd, rSum:rSum, wSum:wSum, totAmp:totAmp};
  }

  function fillsFrom(s,dt){
    let ref=0;
    for (let i=1;i<6;i++) if (s.bnd[i]>s.bnd[ref]+1e-9) ref=i;
    const n=s.bnd[ref]||1;
    const rAvg=s.wSum>0?s.rSum/s.wSum:0;
    const alpha=1-Math.exp(-rAvg*dt/TAU);
    for (let i=0;i<6;i++){
      const corr=(s.val[i]/n)*(s.val[ref]/n);
      Q[i]+=alpha*(corr-Q[i]);
    }
    return Q.map(function(q){
      const x=2*q, st=Math.min(1,Math.abs(x));
      return 'hsl('+(x>=0?25:215)+',80%,'+(97-52*st).toFixed(1)+'%)';
    });
  }

  function draw(fills,dx,dy){
    ctx.clearRect(0,0,cv.width,cv.height);
    const X=cur.px.map(function(p,i){ return [p[0]+dx[i], p[1]+dy[i]]; });
    ctx.strokeStyle='#b9bfc9'; ctx.lineWidth=2.4; ctx.lineCap='round';
    cur.edges.forEach(function(e){
      ctx.beginPath(); ctx.moveTo(X[e[0]][0],X[e[0]][1]); ctx.lineTo(X[e[1]][0],X[e[1]][1]); ctx.stroke();
    });
    for (let i=0;i<6;i++){
      ctx.beginPath(); ctx.arc(X[i][0],X[i][1],R,0,2*Math.PI);
      ctx.fillStyle=fills[i]; ctx.fill();
      ctx.strokeStyle='#333'; ctx.lineWidth=1.4; ctx.stroke();
    }
  }

  function frame(now){
    if (last===null) last=now;
    const dt=Math.min(100, now-last); last=now;
    tAcc+=dt;
    const s=step(tAcc*SPEED);
    const fills=(s.totAmp<=0.005)?NEUTRAL:fillsFrom(s,dt);
    draw(fills,s.dx,s.dy);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  document.getElementById('exSel').addEventListener('change',function(){
    cur=GRAPHS[+this.value];
    prep(cur);
    setDefaults(cur);                 /* еквалайзер підстроївся під граф */
    Q=[0,0,0,0,0,0];
    document.getElementById('lamLab').textContent=cur.label;
  });

  window.setGraph=function(idx){
    const sel=document.getElementById('exSel');
    sel.value=String(idx);
    sel.dispatchEvent(new Event('change'));
  };
})();
</script>
</body>
</html>
