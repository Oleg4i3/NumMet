<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Від Вавілону до Кремнієвої долини</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500;700&family=Unbounded:wght@500;600&display=swap">
<style>
/* Композиція: тонка шапка зі сценами, велике полотно сцени, внизу «ДАЛІ».
   Графіка займає майже весь екран; пояснення живуть у підказках при наведенні.
   Палітра: ляпіс (вавілонська глазур) для інтерфейсу, бурштин для сигналу «1». */
:root {
  --bg: #eef1f7;
  --panel: #ffffff;
  --panel2: #e3e8f3;
  --ink: #0e1a3b;
  --muted: #566287;
  --line: #b4bfd6;
  --accent: #1f3f9e;
  --on-accent: #ffffff;
  --accent-soft: rgba(31, 63, 158, 0.1);
  --sig: #c27f00;
  --on-sig: #1b1300;
  --display: 'Unbounded', 'Golos Text', system-ui, sans-serif;
  --body: 'Golos Text', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1230; --panel: #111c40; --panel2: #18265a; --ink: #e9eefc; --muted: #9fb0d8;
    --line: #33437a; --accent: #8aa4ff; --on-accent: #0a1230; --accent-soft: rgba(138, 164, 255, 0.14);
    --sig: #ffc247; --on-sig: #1b1300; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1230; --panel: #111c40; --panel2: #18265a; --ink: #e9eefc; --muted: #9fb0d8;
  --line: #33437a; --accent: #8aa4ff; --on-accent: #0a1230; --accent-soft: rgba(138, 164, 255, 0.14);
  --sig: #ffc247; --on-sig: #1b1300; color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
.app {
  max-width: 1200px; margin: 0 auto; min-height: 100vh;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 0; display: flex; flex-direction: column;
}
.top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px 24px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.brand { font: 600 12px/1.3 var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.steps { display: flex; gap: 6px; flex-wrap: wrap; }
.dot { width: 30px; height: 30px; padding: 0; border-radius: 50%; border: 1.5px solid var(--line); background: transparent; color: var(--muted); font: 700 12px var(--mono); cursor: pointer; display: grid; place-items: center; }
.dot.done { border-color: var(--sig); color: var(--ink); }
.dot.cur { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.dot:focus-visible, .btn:focus-visible, .bit:focus-visible, .sw:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.stage { flex: 1; padding-block: 20px 28px; outline: none; }

.st { display: flex; align-items: center; gap: 12px; margin: 0 0 16px; font: 600 clamp(18px, 3.2vw, 26px)/1.2 var(--display); text-wrap: balance; }
.lede { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; margin: -6px 0 18px; }
.st-sub { margin: 0; flex: 1 1 320px; max-width: 84ch; font: 500 clamp(14px, 1.9vw, 16px)/1.5 var(--body); color: var(--muted); text-wrap: balance; }
.figs { display: flex; gap: 12px; flex: 0 0 auto; }
.fig { margin: 0; text-align: center; cursor: help; }
.fig img { display: block; height: 88px; width: auto; max-width: 170px; object-fit: contain; border-radius: 8px; border: 1px solid var(--line); background: #fff; padding: 3px; }
.fig figcaption { margin-top: 4px; font: 500 11px/1.3 var(--body); color: var(--muted); }
.st .n { font: 700 13px var(--mono); background: var(--sig); color: var(--on-sig); padding: 3px 9px; border-radius: 6px; }

.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 14px 16px; min-width: 0; }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
.card-h h2 { font: 600 14px var(--display); margin: 0; letter-spacing: 0.02em; }
.hint { font-size: 12px; color: var(--muted); border-bottom: 1px dotted var(--muted); cursor: help; }

.svg { display: block; width: 100%; height: auto; }
.svg text { fill: var(--ink); font-family: var(--body); }
.svg .mono, .svg .sw .lbl, .svg .lv, .svg .bit text, .svg .sum text { font-family: var(--mono); }

.w { fill: none; stroke: var(--line); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; transition: stroke 0.2s; }
.w.on { stroke: var(--sig); stroke-dasharray: 8 6; animation: flow 0.6s linear infinite; }
.w2 { fill: none; stroke: var(--line); stroke-width: 2.5; stroke-linecap: round; transition: stroke 0.2s; }
.w2.on { stroke: var(--sig); }
@keyframes flow { to { stroke-dashoffset: -14; } }
.dotj { fill: var(--line); transition: fill 0.2s; }
.dotj.on { fill: var(--sig); }

.gate { fill: var(--panel2); stroke: var(--line); stroke-width: 2; transition: stroke 0.2s; }
.gate.hot { stroke: var(--sig); stroke-width: 3; }
.gl { font: 700 16px var(--mono); text-anchor: middle; }

.sw { cursor: pointer; }
.sw .trk { fill: var(--panel2); stroke: var(--line); stroke-width: 2; transition: fill 0.2s, stroke 0.2s; }
.sw.on .trk { fill: var(--sig); stroke: var(--sig); }
.sw .knob { fill: var(--ink); transition: transform 0.2s; }
.sw.on .knob { transform: translateX(32px); }
.sw .lbl { font-size: 15px; font-weight: 700; text-anchor: middle; }

.lamp { fill: var(--panel2); stroke: var(--line); stroke-width: 2; transition: fill 0.2s, stroke 0.2s; }
.lamp.on { fill: var(--sig); stroke: var(--sig); }
.lv { font-size: 22px; font-weight: 700; text-anchor: middle; }
.lv.on { fill: var(--on-sig); }
.cap { font-size: 12px; text-anchor: middle; fill: var(--muted); }

.side { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 24px; margin-top: 6px; }
.tt { border-collapse: collapse; font: 600 14px var(--mono); }
.tt th, .tt td { padding: 5px 14px; text-align: center; }
.tt th { color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--line); }
.tt tbody tr { cursor: pointer; }
.tt tbody tr.cur { background: var(--accent-soft); }
.eq { margin: 0; font-size: 17px; }
.eq b { font-family: var(--mono); }
.dim { color: var(--muted); font-size: 13px; }
.mono { font-family: var(--mono); }

.bit { cursor: pointer; }
.bit rect { fill: var(--panel2); stroke: var(--line); stroke-width: 2; transition: fill 0.2s, stroke 0.2s; }
.bit.on rect { fill: var(--sig); stroke: var(--sig); }
.bit text { font-size: 18px; font-weight: 700; text-anchor: middle; }
.bit.on text { fill: var(--on-sig); }
.rl { font-size: 15px; font-weight: 700; text-anchor: middle; fill: var(--muted); }
.fa { fill: var(--panel); stroke: var(--line); stroke-width: 2; transition: stroke 0.2s, fill 0.2s; }
.fa.act { stroke: var(--accent); stroke-width: 3; fill: var(--accent-soft); }
.sg { font-size: 26px; text-anchor: middle; }
.sum rect { fill: none; stroke: var(--line); stroke-width: 2; stroke-dasharray: 4 4; transition: fill 0.2s; }
.sum text { font-size: 18px; font-weight: 700; text-anchor: middle; fill: var(--muted); }
.sum.has rect { fill: var(--panel2); stroke-dasharray: none; }
.sum.has text { fill: var(--ink); }
.sum.one rect { fill: var(--sig); stroke: var(--sig); }
.sum.one text { fill: var(--on-sig); }
.sum.drop { opacity: 0.35; }
.cw { fill: none; stroke: var(--line); stroke-width: 2.5; stroke-linejoin: round; marker-end: url(#arr-off); transition: stroke 0.2s; }
.cw.on { stroke: var(--accent); marker-end: url(#arr-on); }
.cin { stroke: var(--line); stroke-width: 2.5; fill: none; }
.cin-t { font-size: 13px; text-anchor: middle; fill: var(--muted); font-family: var(--mono); }

.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
.btn { font: 600 13px var(--body); padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; transition: background 0.15s; }
.btn:hover { background: var(--panel2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.1); background: var(--accent); }
.btn[disabled] { opacity: 0.45; cursor: default; }

.ladder { display: flex; flex-wrap: wrap; align-items: stretch; gap: 10px 8px; margin-top: 16px; }
.rung { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 92px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); cursor: help; }
.rung .op { font: 700 26px/1.1 var(--mono); }
.rung .nm { font-size: 12px; color: var(--muted); }
.rung.base { background: var(--sig); border-color: var(--sig); color: var(--on-sig); }
.rung.base .nm { color: var(--on-sig); }
.rung.fn .op { font-size: 20px; }
.rung.q { border-style: dashed; background: transparent; }
.rung.q .op { color: var(--accent); }
.arrow { align-self: center; color: var(--muted); font: 700 20px var(--mono); }
.spacer { flex: 0 0 28px; }
.punch { margin: 20px 0 0; font: 500 clamp(17px, 2.6vw, 22px)/1.35 var(--body); text-wrap: balance; }
.punch .mono { font-weight: 700; color: var(--accent); }

.ph { display: grid; place-items: center; align-content: center; gap: 12px; min-height: 48vh; text-align: center; border: 1.5px dashed var(--line); border-radius: 18px; padding: 32px 16px; }
.ph .big { font: 700 clamp(64px, 14vw, 140px)/1 var(--mono); color: var(--line); }
.ph p { max-width: 52ch; margin: 0; font-size: 17px; }
.tag { font: 600 11px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; color: var(--muted); }

.foot { position: sticky; bottom: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--bg); border-top: 1px solid var(--line); }
.count { font: 600 13px var(--mono); color: var(--muted); }
.next { font: 600 14px var(--display); letter-spacing: 0.06em; padding: 12px 26px; }

#tip { position: fixed; left: 0; top: 0; z-index: 50; max-width: min(300px, calc(100vw - 16px)); padding: 8px 11px; border-radius: 8px; background: var(--ink); color: var(--bg); font-size: 13px; line-height: 1.4; pointer-events: none; }


/* ---- сцени 3–4: глина, писар, посадка ---- */
:root { --clay: #e8dcc0; --clay-ink: #5a431c; --halo: transparent; --ok: #1f7a4d; --warn: #b36b00; --bad: #b3261e; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --clay: #3a3023; --clay-ink: #e6d2a6; --halo: rgba(233, 238, 252, 0.6); --ok: #5fd39a; --warn: #ffc247; --bad: #ff8a80; }
}
:root[data-theme="dark"] { --clay: #3a3023; --clay-ink: #e6d2a6; --halo: rgba(233, 238, 252, 0.6); --ok: #5fd39a; --warn: #ffc247; --bad: #ff8a80; }
.scribe { filter: drop-shadow(0 0 1.2px var(--halo)); }
.g3, .g4 { display: grid; gap: 16px; }
.g3 { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
.g4 { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); }
@media (max-width: 880px) { .g3, .g4 { grid-template-columns: minmax(0, 1fr); } }
.mt { margin-top: 16px; }
.btn.on { background: var(--accent-soft); border-color: var(--accent); }
.chip { padding: 6px 12px; }
.sl { display: inline-flex; align-items: center; gap: 8px; font: 600 12px var(--mono); color: var(--muted); }
.sl input { accent-color: var(--accent); width: 110px; }
.sl output { color: var(--ink); min-width: 4.2em; }

/* сцена 3 */
.rect-a { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.5; }
.rect-g { fill: none; stroke: var(--accent); stroke-width: 1.2; }
.rect-t { fill: none; stroke: var(--sig); stroke-width: 2; stroke-dasharray: 6 5; }
.dimt { font: 700 13px var(--mono); text-anchor: middle; fill: var(--ink); }
.bub { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; }
.bubt { font: 500 12.5px var(--body); fill: var(--ink); }
.clay { fill: var(--clay); stroke: var(--clay-ink); stroke-width: 2.5; }
.clay-l { fill: none; stroke: var(--clay-ink); stroke-width: 1.6; opacity: 0.8; }
.wedge { fill: var(--clay-ink); }
.sexa { display: grid; gap: 6px; margin-top: 6px; font: 600 14px var(--mono); }
.sx-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.sx-k { color: var(--muted); font-weight: 500; font-size: 12px; min-width: 7.5em; }
.sx-v .d { padding: 1px 3px; border-radius: 4px; }
.sx-v .d.ok { background: var(--sig); color: var(--on-sig); }
.ax { stroke: var(--line); stroke-width: 1; }
.svg .axt { font: 500 11px var(--mono); fill: var(--muted); }
.pl { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; }
.pd { fill: var(--accent); }
.eps { stroke: var(--sig); stroke-width: 1.5; stroke-dasharray: 5 4; }
.cv { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 760px) { .cv { grid-template-columns: minmax(0, 1fr); } }
.st-t { border-collapse: collapse; font: 500 12.5px var(--mono); width: 100%; }
.st-t th { color: var(--muted); font-weight: 500; text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); }
.st-t td { padding: 4px 6px; white-space: nowrap; }
.st-t tr.cur td { background: var(--accent-soft); font-weight: 700; }
.st-t tr.off td { color: var(--muted); opacity: 0.45; }
.tbl-wrap { overflow-x: auto; }

/* сцена 4 */
.fm { margin: 0 0 6px; font: 500 clamp(18px, 2.6vw, 24px)/1.5 var(--mono); opacity: 0; transform: translateY(6px); transition: opacity 0.9s, transform 0.9s; }
.fm.show { opacity: 1; transform: none; }
.rad { display: inline-flex; align-items: flex-start; }
.rad .rs { font-size: 1.15em; line-height: 1; margin-right: 1px; }
.rad .ri { border-top: 2px solid currentColor; padding: 0 3px; margin-top: 2px; }
.fm .v { cursor: help; border-bottom: 1px dotted var(--muted); }
.fm .v.a { color: var(--accent); } .fm .v.g { color: var(--sig); }
.plt-ax { stroke: var(--line); stroke-width: 1.2; }
.plt-g { stroke: var(--line); stroke-width: 0.6; stroke-dasharray: 2 4; opacity: 0.6; }
.vs { fill: none; stroke: var(--sig); stroke-width: 3; }
.trj { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; }
.pt { fill: var(--accent); stroke: var(--panel); stroke-width: 2; }
.svg .hud { font: 700 13px var(--mono); fill: #fff; stroke: rgba(0, 0, 0, 0.6); stroke-width: 3px; paint-order: stroke; }
.svg .hudr { font: 500 11px var(--mono); fill: rgba(255, 255, 255, 0.85); }
.bub-s { fill: rgba(10, 18, 48, 0.82); stroke: rgba(255, 255, 255, 0.35); stroke-width: 1.2; }
.svg .bubw { font: 500 12px var(--mono); fill: #fff; }
#plotG { transition: opacity 0.9s; }
.res { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; min-height: 28px; margin-top: 8px; font: 500 13px var(--mono); }
.badge { font: 700 12px var(--mono); padding: 3px 10px; border-radius: 999px; border: 1.5px solid currentColor; }
.badge.ok { color: var(--ok); } .badge.warn { color: var(--warn); } .badge.bad { color: var(--bad); }
.cmp { border-collapse: collapse; font: 500 12.5px var(--mono); }
.cmp th, .cmp td { padding: 3px 12px 3px 0; text-align: left; }
.cmp th { color: var(--muted); font-weight: 500; }
.gas { font: 700 14px var(--display); letter-spacing: 0.06em; padding: 12px 28px; user-select: none; touch-action: none; }
.gas.hold { background: var(--sig); border-color: var(--sig); color: var(--on-sig); }
.skip { font-size: 12px; padding: 5px 10px; }

/* сцена 3: геометрична анімація кроку Герона */
:root { --sig-ink: #8a5a00; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --sig-ink: #ffc247; } }
:root[data-theme="dark"] { --sig-ink: #ffc247; }
.g3 { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); }
@media (max-width: 880px) { .g3 { grid-template-columns: minmax(0, 1fr); } }
.svg .gs { stroke-linecap: round; fill: none; }
.svg .gs.ga { stroke: var(--accent); }
.svg .gs.gb { stroke: var(--sig); }
.svg .gs.gi { stroke: var(--ink); }
.svg .rc { fill: var(--accent); stroke: var(--ink); stroke-width: 1.6; }
.svg .rg { fill: none; stroke: var(--ink); stroke-width: 1.4; opacity: 0.28; }
.svg .gd { fill: var(--ink); }
.svg .rt { fill: none; stroke: var(--ink); stroke-width: 2; }
.svg .hyp { fill: none; stroke: var(--muted); stroke-width: 1.3; stroke-dasharray: 5 5; opacity: 0.8; }
.svg .gt { font: 700 13px var(--mono); paint-order: stroke; stroke: var(--panel); stroke-width: 4px; stroke-linejoin: round; }
.svg .gt.ta { fill: var(--accent); } .svg .gt.tb { fill: var(--sig-ink); } .svg .gt.ti { fill: var(--ink); } .svg .gt.tm { fill: var(--muted); font-weight: 600; font-size: 12px; }
.phs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin-top: 8px; }
.phi { font: 600 12px var(--mono); padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); cursor: help; transition: background 0.2s, color 0.2s; }
.phi.dn { border-color: var(--accent); color: var(--ink); }
.phi.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.phs-a { color: var(--line); font: 700 12px var(--mono); }
.theory { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); padding: 10px 16px; }
.theory summary { cursor: pointer; font: 600 13px var(--display); letter-spacing: 0.02em; }
.th-b { max-width: 78ch; font-size: 14px; }
.fmz { font: 600 16px var(--mono); }

/* сцена 2 */
:root { --net: #a0307a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --net: #f08fcf; } }
:root[data-theme="dark"] { --net: #f08fcf; }
.bar2 { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 14px; margin-bottom: 16px; }
.bar2 .sl input { width: 120px; }
.chips { display: inline-flex; gap: 4px; }
.stat2 { margin-left: auto; font: 600 13px var(--mono); color: var(--muted); }
.g2c { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr)); }
.g2d { display: grid; gap: 16px; margin-top: 16px; align-items: start; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); }
@media (max-width: 880px) { .g2d { grid-template-columns: minmax(0, 1fr); } }
.sq.r5 { aspect-ratio: 5 / 4; }
.row.sm { margin: 0 0 8px; min-height: 34px; }
.row.sm select, .card select { font: 600 12.5px var(--body); padding: 6px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); max-width: 100%; }
.sq { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--panel2); }
.sq canvas, .sq .gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.wide { position: relative; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: var(--panel2); }
.wide canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.read { margin: 8px 0 0; font: 500 12px/1.45 var(--mono); color: var(--muted); min-height: 5.2em; }
.g2d .wide { aspect-ratio: 14 / 9; }

.mini { display: flex; flex-wrap: wrap; align-items: center; align-content: flex-start; gap: 6px 12px; margin: 0 0 8px; min-height: 108px; }

<script>
(() => {
  /* Анімація примусова: це демонстрація, де рух і є змістом, а кроки користувач запускає сам. Системний прапорець «зменшити рух» тут свідомо ігнорується. */
  const RM = false;
  const sleep = (ms) => new Promise((r) => setTimeout(r, RM ? 0 : ms));
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

  /* ---------- підказки при наведенні ---------- */
  const tip = $('#tip');
  let tipTimer = 0;
  function placeTip(t) {
    const r = t.getBoundingClientRect();
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let x = r.left + r.width / 2 - w / 2;
    x = Math.max(8, Math.min(x, window.innerWidth - w - 8));
    let y = r.top - h - 10;
    if (y < 8) y = r.bottom + 10;
    tip.style.transform = 'translate(' + x + 'px,' + y + 'px)';
  }
  function showTip(t) {
    const txt = t.getAttribute('data-tip');
    if (!txt) return;
    tip.textContent = txt;
    tip.hidden = false;
    placeTip(t);
  }
  function hideTip() { tip.hidden = true; clearTimeout(tipTimer); }
  document.addEventListener('pointerover', (e) => {
    const t = e.target.closest && e.target.closest('[data-tip]');
    if (t) showTip(t);
  });
  document.addEventListener('pointerout', (e) => {
    const t = e.target.closest && e.target.closest('[data-tip]');
    if (t && !t.contains(e.relatedTarget)) hideTip();
  });
  document.addEventListener('pointerdown', (e) => {
    if (e.pointerType !== 'touch') return;
    const t = e.target.closest && e.target.closest('[data-tip]');
    if (t) { showTip(t); clearTimeout(tipTimer); tipTimer = setTimeout(hideTip, 3500); } else hideTip();
  });
  document.addEventListener('focusin', (e) => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t) showTip(t); });
  document.addEventListener('focusout', hideTip);
  window.addEventListener('scroll', hideTip, { passive: true });

  /* ---------- сцена 1: напівсуматор ---------- */
  function mountHalfAdder(host) {
    const st = { A: 1, B: 1 };
    const sw = (k, y, label) =>
      '<g class="sw" data-k="' + k + '" role="switch" tabindex="0" aria-checked="false" aria-label="Вхід ' + label + '" transform="translate(30 ' + y + ')" data-tip="Клікніть, щоб змінити біт ' + label + '">' +
      '<rect class="trk" width="64" height="32" rx="16"/><circle class="knob" cx="16" cy="16" r="11"/>' +
      '<text class="lbl" x="32" y="-10">' + label + '</text></g>';
    host.innerHTML =
      '<header class="card-h"><h2>Напівсуматор</h2><span class="hint" data-tip="Два входи, два виходи. XOR дає біт суми, AND дає біт переносу. Клікніть на перемикачі A і B або на рядок таблиці.">як це працює</span></header>' +
      '<svg class="svg" viewBox="0 50 520 256" role="img" aria-label="Схема напівсуматора: гейти XOR і AND, входи A і B, виходи S і C">' +
      '<path class="w" id="wA" d="M94 96H220"/><path class="w" id="wA2" d="M150 96V236H220"/>' +
      '<path class="w" id="wB" d="M94 266H220"/><path class="w" id="wB2" d="M186 266V126H220"/>' +
      '<circle class="dotj" id="jA" cx="150" cy="96" r="5"/><circle class="dotj" id="jB" cx="186" cy="266" r="5"/>' +
      '<g data-tip="XOR: на виході 1, лише якщо входи різні."><rect class="gate" id="gX" x="220" y="76" width="100" height="70" rx="12"/><text class="gl" x="270" y="116">XOR</text></g>' +
      '<g data-tip="AND: на виході 1, лише якщо обидва входи дорівнюють 1."><rect class="gate" id="gN" x="220" y="216" width="100" height="70" rx="12"/><text class="gl" x="270" y="256">AND</text></g>' +
      '<path class="w" id="wS" d="M320 111H426"/><path class="w" id="wC" d="M320 251H426"/>' +
      '<g data-tip="Біт суми S"><circle class="lamp" id="lS" cx="452" cy="111" r="24"/><text class="lv" id="vS" x="452" y="119">0</text></g>' +
      '<g data-tip="Біт переносу C. Перенос виникає, коли 1 + 1 = 10 у двійковій системі."><circle class="lamp" id="lC" cx="452" cy="251" r="24"/><text class="lv" id="vC" x="452" y="259">0</text></g>' +
      '<text class="cap" x="452" y="154">S · сума</text><text class="cap" x="452" y="294">C · перенос</text>' +
      sw('A', 80, 'A') + sw('B', 250, 'B') +
      '</svg>' +
      '<div class="side"><table class="tt" aria-label="Таблиця істинності"><thead><tr><th>A</th><th>B</th><th>C</th><th>S</th></tr></thead><tbody>' +
      [[0, 0], [0, 1], [1, 0], [1, 1]].map(([a, b]) => '<tr data-a="' + a + '" data-b="' + b + '"><td>' + a + '</td><td>' + b + '</td><td>' + (a & b) + '</td><td>' + (a ^ b) + '</td></tr>').join('') +
      '</tbody></table><p class="eq" id="haEq" aria-live="polite"></p></div>';

    const q = (s) => host.querySelector(s);
    const tog = (el, on) => el.classList.toggle('on', !!on);
    function upd() {
      const A = st.A, B = st.B, S = A ^ B, C = A & B;
      $$('.sw', host).forEach((g) => { const on = st[g.dataset.k]; tog(g, on); g.setAttribute('aria-checked', String(!!on)); });
      tog(q('#wA'), A); tog(q('#wA2'), A); tog(q('#jA'), A);
      tog(q('#wB'), B); tog(q('#wB2'), B); tog(q('#jB'), B);
      tog(q('#wS'), S); tog(q('#wC'), C);
      q('#gX').classList.toggle('hot', !!S); q('#gN').classList.toggle('hot', !!C);
      tog(q('#lS'), S); tog(q('#lC'), C);
      q('#vS').textContent = S; q('#vC').textContent = C;
      tog(q('#vS'), S); tog(q('#vC'), C);
      $$('tbody tr', host).forEach((tr) => tr.classList.toggle('cur', +tr.dataset.a === A && +tr.dataset.b === B));
      q('#haEq').innerHTML = A + ' + ' + B + ' = <b>' + C + S + '</b><sub>2</sub> <span class="dim">(' + (A + B) + ')</span>';
    }
    host.addEventListener('click', (e) => {
      const g = e.target.closest('.sw');
      if (g) { st[g.dataset.k] ^= 1; upd(); return; }

      if (tr) { st.A = +tr.dataset.a; st.B = +tr.dataset.b; upd(); }
    });
    host.addEventListener('keydown', (e) => {
      const g = e.target.closest && e.target.closest('.sw');
      if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); st[g.dataset.k] ^= 1; upd(); }
    });
    upd();
    return () => {};
  }

  /* ---------- сцена 1: чотирибітний суматор ---------- */
  function mountFourBit(host) {
    const CX = [450, 350, 250, 150];
    let a = 5, b = 3, sub = false, token = 0, auto = 0;
    const fresh = () => ({ sum: [null, null, null, null, null], carry: [0, 0, 0, 0, 0], active: -1, done: false });
    let shown = fresh();
